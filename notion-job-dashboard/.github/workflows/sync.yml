name: Sync Notion data

on:
  schedule:
    - cron: "0 */6 * * *"   # 6시간마다. 필요시 조정하세요.
  workflow_dispatch: {}      # Actions 탭에서 수동 실행 버튼도 생김

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch data from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node sync/fetch_notion.mjs

      - name: Commit updated data (if changed)
        run: |
          git config user.name "notion-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/jobs.json data/skills.json data/events.json
          git diff --quiet --cached || git commit -m "chore: sync notion data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
