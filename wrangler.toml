name = "job-dashboard-api"
main = "worker/index.js"
compatibility_date = "2024-09-01"

# 아래 두 값은 여기 적지 말고, 배포 후 다음 명령으로 등록하세요 (비밀값이라 파일에 적지 않습니다):
#   wrangler secret put NOTION_TOKEN
#   wrangler secret put APP_SECRET
#
# ALLOWED_ORIGIN은 굳이 비밀이 아니라 여기 vars로 둬도 되지만,
# 자신의 GitHub Pages 주소로 바꿔서 CORS를 제한하는 걸 권장합니다.
[vars]
ALLOWED_ORIGIN = "*"
