<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>취업준비 컨트롤보드</title>
<style>
  :root{
    --bg:#F1F2EE; --paper:#FFFFFF; --ink:#23262B; --ink-soft:#5B6069;
    --navy:#1F3B57; --navy-soft:#3A5975;
    --hi:#B3452C; --hi-bg:#F7E7E2;
    --mid:#B8842E; --mid-bg:#F7EEDD;
    --low:#8B93A1; --low-bg:#EDEEF1;
    --unrated:#B8BCC4;
    --green:#3F6B52; --green-bg:#E6EDE8;
    --purple:#6B5B95;
    --line:#E1E1DC; --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif;line-height:1.5;}
  h1,h2,h3{font-family:Georgia,"Noto Serif KR",serif;font-weight:600;margin:0;}
  header.top{background:var(--navy);color:#fff;padding:24px clamp(16px,4vw,48px) 18px;}
  header.top .row{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px;}
  header.top h1{font-size:1.4rem;letter-spacing:-0.01em;}
  header.top .sub{color:#B9C7D3;font-size:0.83rem;margin-top:4px;}
  .sync-info{font-size:0.72rem;color:#9FB0BE;}
  .dday-strip{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
  .dday-chip{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.18);border-radius:999px;padding:6px 14px;font-size:0.8rem;white-space:nowrap;}
  .dday-chip b{color:#FFD9CC;}
  nav.tabs{display:flex;gap:4px;padding:0 clamp(16px,4vw,48px);background:var(--navy-soft);}
  nav.tabs button{border:none;background:transparent;color:#E4EAEF;padding:11px 18px;font-size:0.9rem;cursor:pointer;border-bottom:3px solid transparent;font-family:inherit;}
  nav.tabs button.active{color:#fff;border-bottom:3px solid var(--hi);font-weight:600;}
  main{max-width:1300px;margin:0 auto;padding:24px clamp(16px,4vw,32px) 80px;}
  section.panel{display:none;} section.panel.active{display:block;}
  .note-banner{background:#FFF8EC;border:1px solid #EFDBAE;color:#7A5A16;font-size:0.76rem;padding:9px 14px;border-radius:8px;margin-bottom:16px;}

  .kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;overflow-x:auto;}
  .kcol{background:#EAEBE6;border-radius:var(--radius);padding:10px;min-height:220px;}
  .kcol.dragover{outline:2px dashed var(--navy);}
  .kcol h3{font-size:0.82rem;color:var(--navy);margin-bottom:8px;display:flex;justify-content:space-between;}
  .kcol h3 .n{color:var(--ink-soft);font-weight:400;}
  .job-card{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--low);
    border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:grab;font-size:0.8rem;}
  .job-card.상{border-left-color:var(--hi);} .job-card.중{border-left-color:var(--mid);}
  .job-card.하{border-left-color:var(--low);} .job-card.미평가{border-left-color:var(--unrated);border-left-style:dashed;}
  .job-card.dragging{opacity:0.4;}
  .job-card .company{font-size:0.72rem;color:var(--ink-soft);margin-bottom:2px;}
  .job-card .title{font-weight:600;margin-bottom:6px;line-height:1.3;}
  .job-card .meta{display:flex;flex-wrap:wrap;gap:4px;font-size:0.68rem;color:var(--ink-soft);margin-bottom:6px;}
  .job-card .meta span{background:var(--bg);border-radius:5px;padding:1px 6px;}
  .job-card .foot{display:flex;justify-content:space-between;align-items:center;}
  .badge-dday{font-size:0.68rem;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--low-bg);color:var(--low);}
  .badge-dday.urgent{background:var(--hi-bg);color:var(--hi);} .badge-dday.soon{background:var(--mid-bg);color:var(--mid);}
  .job-card a{font-size:0.7rem;color:var(--navy);text-decoration:none;font-weight:600;}
  .job-card select.status-select{margin-top:8px;width:100%;font-size:0.72rem;padding:4px 6px;border:1px solid var(--line);border-radius:6px;font-family:inherit;background:var(--paper);color:var(--ink);}

  .btn{border:1px solid var(--navy);background:var(--navy);color:#fff;padding:8px 16px;border-radius:8px;font-size:0.85rem;cursor:pointer;font-family:inherit;}
  .btn.ghost{background:transparent;color:var(--navy);}
  .btn.small{padding:4px 10px;font-size:0.76rem;border-radius:6px;}
  .btn.danger{border-color:var(--hi);color:var(--hi);background:transparent;}
  .toolbar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:14px;}

  .skill-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;}
  .skill-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:20px;position:relative;}
  .skill-card .cat{display:inline-block;font-size:0.72rem;color:var(--green);background:var(--green-bg);padding:2px 9px;border-radius:999px;margin-bottom:8px;}
  .skill-card h3{font-size:1.05rem;margin-bottom:6px;}
  .skill-card .goal{font-size:0.85rem;color:var(--ink-soft);margin-bottom:14px;}
  .progress-bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;margin-bottom:6px;}
  .progress-bar .fill{height:100%;background:var(--green);border-radius:99px;}
  .progress-label{display:flex;justify-content:space-between;font-size:0.76rem;color:var(--ink-soft);margin-bottom:14px;}
  .progress-controls{display:flex;gap:6px;margin-bottom:16px;}
  .progress-controls button{border:1px solid var(--line);background:var(--paper);width:26px;height:26px;border-radius:6px;cursor:pointer;font-size:0.9rem;}
  .steps{list-style:none;margin:0 0 10px;padding:0;}
  .steps li{display:flex;gap:8px;align-items:center;font-size:0.82rem;padding:6px 0;border-bottom:1px dashed var(--line);}
  .steps li:last-child{border-bottom:none;}
  .steps li span{flex:1;}
  .steps li.done span{text-decoration:line-through;color:var(--ink-soft);}
  .steps li .del-step{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:0.9rem;padding:0 4px;}
  .add-step-row{display:flex;gap:6px;margin-bottom:14px;}
  .add-step-row input{flex:1;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:0.8rem;font-family:inherit;}
  .skill-card textarea{width:100%;min-height:56px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:inherit;font-size:0.8rem;resize:vertical;color:var(--ink);}
  .skill-card .note-label{font-size:0.74rem;color:var(--ink-soft);margin-bottom:4px;display:block;}
  .skill-card .target{margin-top:14px;font-size:0.78rem;color:var(--ink-soft);display:flex;justify-content:space-between;}
  .skill-card .card-actions{position:absolute;top:16px;right:16px;display:flex;gap:6px;}
  .skill-meta-edit{display:none;border:1px dashed var(--navy);border-radius:8px;padding:12px;margin-bottom:14px;}
  .skill-meta-edit.open{display:block;}
  .skill-meta-edit .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
  .skill-meta-edit input, .skill-meta-edit select{border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:0.8rem;font-family:inherit;}
  .skill-meta-edit input[type=text]{flex:1;min-width:160px;}
  .skill-meta-edit .actions{display:flex;gap:6px;justify-content:flex-end;}

  .inline-form{background:var(--paper);border:1px dashed var(--navy);border-radius:var(--radius);padding:18px;margin-bottom:16px;display:none;}
  .inline-form.open{display:block;}
  .inline-form .row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
  .inline-form input, .inline-form select{border:1px solid var(--line);border-radius:6px;padding:7px 9px;font-size:0.85rem;font-family:inherit;}
  .inline-form input[type=text]{flex:2;min-width:200px;}
  .inline-form .actions{display:flex;gap:8px;justify-content:flex-end;}
  .inline-form .steps-editor{margin-bottom:10px;}
  .inline-form .steps-editor li{display:flex;gap:6px;align-items:center;font-size:0.8rem;padding:4px 0;}
  .inline-form .steps-editor li span{flex:1;}

  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:10px;}
  .cal-head .nav-btns button{border:1px solid var(--line);background:var(--paper);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:0.85rem;}
  .cal-legend{display:flex;gap:12px;font-size:0.76rem;color:var(--ink-soft);align-items:center;flex-wrap:wrap;}
  .cal-legend .tag{display:inline-flex;align-items:center;gap:5px;}
  .legend-dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .color-pick{width:20px;height:20px;border:none;padding:0;border-radius:4px;vertical-align:middle;cursor:pointer;}
  .grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .grid7 .dow{text-align:center;font-size:0.74rem;color:var(--ink-soft);padding:4px 0;}
  .day-cell{background:var(--paper);border:1px solid var(--line);border-radius:8px;min-height:104px;padding:6px;font-size:0.78rem;cursor:pointer;}
  .day-cell.empty{background:transparent;border:none;cursor:default;}
  .day-cell.today{border-color:var(--navy);border-width:2px;}
  .day-cell.dragover{outline:2px dashed var(--green);}
  .day-cell .num{color:var(--ink-soft);margin-bottom:4px;}
  .day-cell .evlist{display:flex;flex-direction:column;gap:2px;}
  .day-cell .evline{font-size:0.68rem;padding:1px 4px;border-left:3px solid transparent;background:var(--bg);border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);cursor:grab;}
  .day-cell .evline.done{text-decoration:line-through;color:var(--ink-soft);}
  .day-cell .more{font-size:0.68rem;color:var(--ink-soft);padding-left:4px;}
  .cal-add-btn{margin-bottom:14px;}

  /* popover */
  #overlay-bg{position:fixed;inset:0;background:rgba(20,25,30,0.25);display:none;z-index:40;}
  #overlay-bg.open{display:block;}
  #day-popover{
    position:fixed;z-index:50;background:var(--paper);border:1px solid var(--line);border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,0.18);width:340px;max-height:80vh;overflow-y:auto;padding:16px;display:none;
  }
  #day-popover.open{display:block;}
  #day-popover .ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  #day-popover .ph h3{font-size:0.95rem;color:var(--navy);}
  #day-popover .ph button{border:none;background:none;font-size:1.1rem;cursor:pointer;color:var(--ink-soft);}
  .pev{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px;cursor:grab;}
  .pev .tag{display:inline-flex;align-items:center;gap:5px;font-size:0.7rem;color:var(--ink-soft);margin-bottom:4px;}
  .pev .ptitle{font-weight:600;font-size:0.85rem;margin-bottom:2px;display:flex;align-items:center;gap:6px;}
  .pev .ptitle.done{text-decoration:line-through;color:var(--ink-soft);}
  .pev .pdetail{font-size:0.76rem;color:var(--ink-soft);margin-bottom:6px;}
  .pev .prow-actions{display:flex;gap:6px;margin-top:6px;}
  .pev .psteps{list-style:none;margin:6px 0;padding:0;}
  .pev .psteps li{display:flex;gap:6px;align-items:center;font-size:0.78rem;padding:3px 0;}
  .pev .psteps li span{flex:1;}
  .pev .psteps li.done span{text-decoration:line-through;color:var(--ink-soft);}
  .pev .psteps li button{background:none;border:none;color:var(--ink-soft);cursor:pointer;}
  .pev .padd-step{display:flex;gap:4px;margin-top:4px;}
  .pev .padd-step input{flex:1;font-size:0.76rem;padding:3px 6px;border:1px solid var(--line);border-radius:5px;}
  .pev .pedit-fields{display:none;margin-top:8px;border-top:1px dashed var(--line);padding-top:8px;}
  .pev .pedit-fields.open{display:block;}
  .pev .pedit-fields .row{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap;}
  .pev .pedit-fields input, .pev .pedit-fields select{font-size:0.78rem;padding:4px 6px;border:1px solid var(--line);border-radius:6px;flex:1;}
</style>
</head>
<body>

<header class="top">
  <div class="row">
    <div><h1>취업준비 컨트롤보드</h1><div class="sub" id="today-str"></div></div>
    <div class="sync-info" id="sync-info"></div>
  </div>
  <div class="dday-strip" id="dday-strip"></div>
</header>

<nav class="tabs">
  <button class="active" data-tab="jobs">공고 현황</button>
  <button data-tab="skills">스킬 개발</button>
  <button data-tab="calendar">캘린더</button>
</nav>

<main>

<section class="panel active" id="panel-jobs">
  <div class="note-banner" id="worker-warning" style="display:none;">WORKER_URL이 설정되지 않아 변경사항이 저장되지 않습니다. index.html 상단 CONFIG를 채워주세요.</div>
  <div class="note-banner">카드를 드래그하거나, 카드 하단 드롭다운으로 상태를 바로 바꿀 수 있어요 (스킵·마감으로 바꾸면 화면에서 사라지고 Notion엔 남습니다).</div>
  <div class="kanban" id="kanban"></div>
</section>

<section class="panel" id="panel-skills">
  <div class="toolbar"><button class="btn" id="btn-new-skill">+ 새 스킬 트래커 추가</button></div>
  <div class="inline-form" id="new-skill-form">
    <div class="row">
      <input type="text" id="ns-name" placeholder="예: 빅데이터분석기사 필기">
      <select id="ns-category"><option value="어학">어학</option><option value="코딩">코딩</option><option value="자격증" selected>자격증</option><option value="기타">기타</option></select>
    </div>
    <div class="row">
      <input type="text" id="ns-goal" placeholder="목표" style="flex:1;min-width:240px;">
      <input type="date" id="ns-target">
      <input type="number" id="ns-hours" placeholder="주간 목표시간(h)" style="width:150px;">
    </div>
    <div class="actions"><button class="btn ghost small" id="ns-cancel">취소</button><button class="btn small" id="ns-save">추가하기 (Notion에 저장)</button></div>
  </div>
  <div class="skill-grid" id="skill-grid"></div>
</section>

<section class="panel" id="panel-calendar">
  <div class="cal-head">
    <div class="nav-btns">
      <button id="cal-prev">← 이전달</button><button id="cal-today">이번달</button><button id="cal-next">다음달 →</button>
    </div>
    <h2 id="cal-title" style="color:var(--navy);font-size:1.05rem;"></h2>
    <div class="cal-legend" id="cal-legend"></div>
  </div>
  <button class="btn small cal-add-btn" id="btn-new-event">+ 일정 추가</button>
  <div class="inline-form" id="new-event-form">
    <div class="row">
      <input type="text" id="ne-title" placeholder="일정 제목">
      <input type="date" id="ne-date">
      <select id="ne-category"><option value="개인일정" selected>개인일정</option><option value="공고관련">공고관련</option><option value="스킬관련">스킬관련</option></select>
    </div>
    <div class="row"><input type="text" id="ne-note" placeholder="메모 (선택)" style="flex:1;"></div>
    <div class="actions"><button class="btn ghost small" id="ne-cancel">취소</button><button class="btn small" id="ne-save">추가하기 (Notion에 저장)</button></div>
  </div>
  <div class="grid7" id="cal-dow"></div>
  <div class="grid7" id="cal-grid" style="margin-top:6px;"></div>
</section>

</main>

<div id="overlay-bg"></div>
<div id="day-popover"></div>

<script>
/* ===================== CONFIG — 배포 후 여기 두 값만 채우세요 ===================== */
const WORKER_URL = "https://job-dashboard-api.yvette-job-tracker.workers.dev";      
const APP_SECRET = "nicevictory2028";    
/* ================================================================================= */

const TODAY = new Date();
let jobs = [], skills = [], events = [];
const ALL_STATUSES = ["신규","검토중","지원함","스킵","마감"];
const VISIBLE_STATUSES = ["신규","검토중","지원함"];
const CATEGORIES = ["공고관련","스킬관련","개인일정"];
const DEFAULT_COLORS = {"공고관련":"#1F3B57","스킬관련":"#3F6B52","개인일정":"#6B5B95"};
let CAT_COLORS = JSON.parse(localStorage.getItem('cal_cat_colors') || 'null') || {...DEFAULT_COLORS};

function dday(dateStr){ if(!dateStr) return null; const d=new Date(dateStr+'T00:00:00'); return Math.round((d-new Date(TODAY.toDateString()))/86400000); }
function ddayLabel(dateStr){
  const n=dday(dateStr);
  if(n===null) return {text:"미정",cls:""};
  if(n<0) return {text:"마감",cls:""};
  if(n===0) return {text:"D-DAY",cls:"urgent"};
  if(n<=7) return {text:"D-"+n,cls:"urgent"};
  if(n<=14) return {text:"D-"+n,cls:"soon"};
  return {text:"D-"+n,cls:""};
}
function fmtDate(dateStr){ if(!dateStr) return "날짜 미정"; const d=new Date(dateStr+'T00:00:00'); return `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}`; }
function toISODate(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

async function api(action, payload){
  if(!WORKER_URL){ alert("WORKER_URL이 설정되지 않았습니다. (변경사항 저장 안 됨)"); throw new Error("WORKER_URL not set"); }
  const res = await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({secret:APP_SECRET,action,payload})});
  const data = await res.json();
  if(!res.ok || data.ok===false) throw new Error(data.error || "요청 실패");
  return data.result;
}
async function loadData(){
  const [jr,sr,er] = await Promise.all([
    fetch('./data/jobs.json',{cache:'no-store'}).then(r=>r.json()).catch(()=>({jobs:[]})),
    fetch('./data/skills.json',{cache:'no-store'}).then(r=>r.json()).catch(()=>({skills:[]})),
    fetch('./data/events.json',{cache:'no-store'}).then(r=>r.json()).catch(()=>({events:[]})),
  ]);
  jobs = jr.jobs || [];
  skills = (sr.skills||[]).map(s=>({...s, steps:s.steps||[], progress:s.progress||0, note:s.note||""}));
  events = (er.events||[]).map(e=>({...e, category:e.category||'개인일정', steps:e.steps||[], done:!!e.done}));
  const latest = [jr.updatedAt, sr.updatedAt, er.updatedAt].filter(Boolean).sort().pop();
  document.getElementById('sync-info').textContent = latest ? 'Notion 마지막 동기화: '+new Date(latest).toLocaleString('ko-KR') : '';
  if(!WORKER_URL) document.getElementById('worker-warning').style.display='block';
}

document.querySelectorAll('nav.tabs button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('section.panel').forEach(p=>p.classList.remove('active'));
    document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
  });
});

function renderStrip(){
  document.getElementById('today-str').textContent = `${TODAY.getFullYear()}년 ${TODAY.getMonth()+1}월 ${TODAY.getDate()}일 기준`;
  const active = jobs.filter(j=>j.deadline && j.status==='검토중');
  active.sort((a,b)=>dday(a.deadline)-dday(b.deadline));
  const strip = document.getElementById('dday-strip'); strip.innerHTML='';
  active.slice(0,4).forEach(j=>{
    const n=dday(j.deadline);
    const chip=document.createElement('div'); chip.className='dday-chip';
    chip.innerHTML=`<b>D-${n<0?'마감':n}</b> · ${j.company}`;
    strip.appendChild(chip);
  });
}

/* ---------- kanban ---------- */
async function changeJobStatus(j, newStatus){
  if(!j.id){ alert('테스트 데이터라 상태를 바꿀 수 없어요. Actions를 한 번 실행하면 됩니다.'); return; }
  if(j.status===newStatus) return;
  const prev=j.status; j.status=newStatus; renderKanban();
  try{ await api('updateJobStatus',{pageId:j.id,status:newStatus}); }
  catch(err){ j.status=prev; renderKanban(); alert('저장 실패: '+err.message); }
}
function jobCard(j){
  const dd=ddayLabel(j.deadline); const p=j.priority||'미평가';
  const div=document.createElement('div'); div.className='job-card '+p; div.draggable=true; div.dataset.id=j.id||'';
  div.innerHTML=`
    <div class="company">${j.company||''}</div>
    <div class="title">${j.title||''}</div>
    <div class="meta"><span>${j.location||'-'}</span><span>${j.employment||'-'}</span>${j.score!=null?`<span>적합도 ${j.score}</span>`:''}</div>
    <div class="foot"><span class="badge-dday ${dd.cls}">${dd.text}</span>${j.link?`<a href="${j.link}" target="_blank" rel="noopener">보기 ↗</a>`:''}</div>
    <select class="status-select">${ALL_STATUSES.map(s=>`<option value="${s}" ${s===j.status?'selected':''}>${s}</option>`).join('')}</select>`;
  const sel=div.querySelector('.status-select');
  sel.addEventListener('mousedown',e=>e.stopPropagation());
  sel.addEventListener('change',e=>changeJobStatus(j,e.target.value));
  div.addEventListener('dragstart',e=>{
    if(!j.id){ e.preventDefault(); alert('테스트 데이터라 드래그할 수 없어요.'); return; }
    e.dataTransfer.setData('text/plain', JSON.stringify({kind:'job',id:j.id}));
    div.classList.add('dragging');
  });
  div.addEventListener('dragend',()=>div.classList.remove('dragging'));
  return div;
}
function renderKanban(){
  const board=document.getElementById('kanban'); board.innerHTML='';
  VISIBLE_STATUSES.forEach(status=>{
    const col=document.createElement('div'); col.className='kcol'; col.dataset.status=status;
    const items=jobs.filter(j=>j.status===status);
    items.sort((a,b)=>{const da=a.deadline?dday(a.deadline):9999, db=b.deadline?dday(b.deadline):9999; return da-db;});
    col.innerHTML=`<h3>${status} <span class="n">${items.length}</span></h3>`;
    items.forEach(j=>col.appendChild(jobCard(j)));
    col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('dragover');});
    col.addEventListener('dragleave',()=>col.classList.remove('dragover'));
    col.addEventListener('drop', async e=>{
      e.preventDefault(); col.classList.remove('dragover');
      let data; try{data=JSON.parse(e.dataTransfer.getData('text/plain'));}catch{return;}
      if(data.kind!=='job') return;
      const job=jobs.find(x=>x.id===data.id);
      if(!job||job.status===status) return;
      await changeJobStatus(job, status);
    });
    board.appendChild(col);
  });
}

/* ---------- skills ---------- */
function renderSkills(){
  const grid=document.getElementById('skill-grid'); grid.innerHTML='';
  skills.forEach(s=>{
    const dd=s.targetDate?ddayLabel(s.targetDate):null;
    const card=document.createElement('div'); card.className='skill-card';
    card.innerHTML=`
      <div class="card-actions">
        <button class="btn small ghost" data-action="edit-skill">수정</button>
        <button class="btn small danger" data-action="delete-skill">삭제</button>
      </div>
      <span class="cat">${s.category||''}</span>
      <h3 class="s-name">${s.name||''}</h3>
      <div class="goal s-goal">${s.goal||''}</div>
      <div class="skill-meta-edit">
        <div class="row"><input type="text" class="em-name" value="${(s.name||'').replace(/"/g,'&quot;')}" placeholder="항목명">
        <select class="em-category">${['어학','코딩','자격증','기타'].map(c=>`<option value="${c}" ${c===s.category?'selected':''}>${c}</option>`).join('')}</select></div>
        <div class="row"><input type="text" class="em-goal" value="${(s.goal||'').replace(/"/g,'&quot;')}" placeholder="목표" style="flex:1;">
        <input type="date" class="em-target" value="${s.targetDate||''}">
        <input type="number" class="em-hours" value="${s.weeklyHours||''}" placeholder="주간(h)" style="width:90px;"></div>
        <div class="actions"><button class="btn ghost small em-cancel">취소</button><button class="btn small em-save">저장</button></div>
      </div>
      <div class="progress-bar"><div class="fill" style="width:${s.progress}%"></div></div>
      <div class="progress-label"><span>진행률</span><span class="progress-val">${s.progress}%</span></div>
      <div class="progress-controls"><button data-delta="-10">−</button><button data-delta="10">+</button></div>
      <ul class="steps">${s.steps.map((step,i)=>`<li class="${step.done?'done':''}" data-idx="${i}"><input type="checkbox" ${step.done?'checked':''}><span>${step.text}</span><button class="del-step">×</button></li>`).join('')}</ul>
      <div class="add-step-row"><input type="text" placeholder="새 체크리스트 항목 추가 후 Enter"></div>
      <span class="note-label">나만의 메모 / 학습법 조정</span>
      <textarea placeholder="학습 방법, 이번 주 계획 등을 자유롭게 적어두세요.">${s.note||''}</textarea>
      <div class="target"><span>주간 목표 ${s.weeklyHours?s.weeklyHours+'시간':'—'}</span><span>${s.targetDate?'목표일 '+fmtDate(s.targetDate)+' ('+dd.text+')':'목표일 미정'}</span></div>`;

    async function pushState(){ try{ await api('updateSkillState',{pageId:s.id,progress:s.progress,steps:s.steps,note:s.note}); }catch(err){ alert('저장 실패: '+err.message); } }

    card.querySelector('[data-action="delete-skill"]').addEventListener('click', async ()=>{
      if(!confirm(`"${s.name}" 트래커를 Notion에서도 삭제할까요?`)) return;
      try{ await api('deleteSkill',{pageId:s.id}); skills=skills.filter(x=>x.id!==s.id); renderSkills(); }
      catch(err){ alert('삭제 실패: '+err.message); }
    });
    const editBox = card.querySelector('.skill-meta-edit');
    card.querySelector('[data-action="edit-skill"]').addEventListener('click', ()=>editBox.classList.toggle('open'));
    card.querySelector('.em-cancel').addEventListener('click', ()=>editBox.classList.remove('open'));
    card.querySelector('.em-save').addEventListener('click', async ()=>{
      const payload = {
        pageId: s.id,
        name: card.querySelector('.em-name').value.trim(),
        category: card.querySelector('.em-category').value,
        goal: card.querySelector('.em-goal').value.trim(),
        targetDate: card.querySelector('.em-target').value || null,
        weeklyHours: card.querySelector('.em-hours').value ? Number(card.querySelector('.em-hours').value) : null,
      };
      try{
        await api('updateSkillMeta', payload);
        Object.assign(s, {name:payload.name, category:payload.category, goal:payload.goal, targetDate:payload.targetDate, weeklyHours:payload.weeklyHours});
        renderSkills();
      }catch(err){ alert('저장 실패: '+err.message); }
    });
    card.querySelectorAll('.progress-controls button').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        s.progress=Math.max(0,Math.min(100,s.progress+parseInt(btn.dataset.delta)));
        card.querySelector('.fill').style.width=s.progress+'%';
        card.querySelector('.progress-val').textContent=s.progress+'%';
        await pushState();
      });
    });
    card.querySelectorAll('.steps li').forEach(li=>{
      const idx=parseInt(li.dataset.idx);
      li.querySelector('input').addEventListener('change', async e=>{ s.steps[idx].done=e.target.checked; li.classList.toggle('done',e.target.checked); await pushState(); });
      li.querySelector('.del-step').addEventListener('click', async ()=>{ s.steps.splice(idx,1); renderSkills(); await pushState(); });
    });
    card.querySelector('.add-step-row input').addEventListener('keydown', async e=>{
      if(e.key==='Enter' && e.target.value.trim()){ s.steps.push({text:e.target.value.trim(),done:false}); renderSkills(); await pushState(); }
    });
    let saveTimer;
    card.querySelector('textarea').addEventListener('input', e=>{
      clearTimeout(saveTimer);
      saveTimer=setTimeout(async ()=>{ s.note=e.target.value; await pushState(); },600);
    });
    grid.appendChild(card);
  });
}
document.getElementById('btn-new-skill').addEventListener('click', ()=>document.getElementById('new-skill-form').classList.add('open'));
document.getElementById('ns-cancel').addEventListener('click', ()=>document.getElementById('new-skill-form').classList.remove('open'));
document.getElementById('ns-save').addEventListener('click', async ()=>{
  const name=document.getElementById('ns-name').value.trim();
  if(!name){ alert('항목명을 입력해주세요.'); return; }
  const payload={ name, category:document.getElementById('ns-category').value, goal:document.getElementById('ns-goal').value.trim(),
    targetDate:document.getElementById('ns-target').value||null, weeklyHours:document.getElementById('ns-hours').value?Number(document.getElementById('ns-hours').value):null };
  try{
    const result = await api('createSkill', payload);
    skills.push({id:result.id, ...payload, steps:[], progress:0, note:""});
    renderSkills();
    ['ns-name','ns-goal','ns-target','ns-hours'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('new-skill-form').classList.remove('open');

});

/* ---------- calendar ---------- */
let calYear=TODAY.getFullYear(), calMonth=TODAY.getMonth();

function renderLegend(){
  const el=document.getElementById('cal-legend');
  el.innerHTML = CATEGORIES.map(c=>`
    <span class="tag"><input type="color" class="color-pick" data-cat="${c}" value="${CAT_COLORS[c]}"><span>${c}</span></span>
  `).join('');
  el.querySelectorAll('.color-pick').forEach(inp=>{
    inp.addEventListener('input', e=>{
      CAT_COLORS[e.target.dataset.cat] = e.target.value;
      localStorage.setItem('cal_cat_colors', JSON.stringify(CAT_COLORS));
      renderCalendar();
    });
  });
}

function allEvents(){
  const evs=[];
  jobs.forEach(j=>{ if(j.deadline && (j.status==='신규' || j.status==='검토중')) evs.push({kind:'job',id:j.id,date:j.deadline,category:'공고관련',title:j.company+' 마감',detail:j.title,steps:null}); });
  skills.forEach(s=>{ if(s.targetDate) evs.push({kind:'skill',id:s.id,date:s.targetDate,category:'스킬관련',title:(s.name||'').split(' — ')[0]+' 목표일',detail:s.goal||'',steps:null}); });
  events.forEach(ev=>{ if(ev.date) evs.push({kind:'event',id:ev.id,date:ev.date,category:ev.category||'개인일정',title:ev.title,detail:ev.note||'',steps:ev.steps||[],done:!!ev.done}); });
  return evs;
}

function renderCalendar(){
  const EVENTS = allEvents();
  document.getElementById('cal-title').textContent = `${calYear}년 ${calMonth+1}월`;
  document.getElementById('cal-dow').innerHTML = ['일','월','화','수','목','금','토'].map(d=>`<div class="dow">${d}</div>`).join('');
  const gridEl=document.getElementById('cal-grid'); gridEl.innerHTML='';
  const firstDay=new Date(calYear,calMonth,1).getDay();
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  for(let i=0;i<firstDay;i++){ const e=document.createElement('div'); e.className='day-cell empty'; gridEl.appendChild(e); }
  for(let d=1; d<=daysInMonth; d++){
    const dateStr=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const cell=document.createElement('div'); cell.className='day-cell';
    if(dateStr===toISODate(TODAY)) cell.classList.add('today');
    const dayEvents=EVENTS.filter(e=>e.date===dateStr);
    const numDiv = document.createElement('div'); numDiv.className='num'; numDiv.textContent = d;
    const listDiv = document.createElement('div'); listDiv.className='evlist';
    const shown = dayEvents.slice(0,3);
    const extra = dayEvents.length - shown.length;
    shown.forEach(e=>{
      const line = document.createElement('div');
      line.className = 'evline' + (e.done ? ' done' : '');
      line.style.borderLeftColor = CAT_COLORS[e.category];
      line.textContent = e.title;
      if(e.id){
        line.draggable = true;
        line.addEventListener('dragstart', ev=>{ ev.stopPropagation(); ev.dataTransfer.setData('text/plain', JSON.stringify({kind:e.kind, id:e.id})); });
      }
      listDiv.appendChild(line);
    });
    if(extra>0){ const more=document.createElement('div'); more.className='more'; more.textContent = `+${extra}개 더보기`; listDiv.appendChild(more); }
    cell.innerHTML = '';
    cell.appendChild(numDiv);
    cell.appendChild(listDiv);
    cell.addEventListener('click', ()=>openDayPopover(dateStr, cell));
    cell.addEventListener('dragover', e=>{ e.preventDefault(); cell.classList.add('dragover'); });
    cell.addEventListener('dragleave', ()=>cell.classList.remove('dragover'));
    cell.addEventListener('drop', async e=>{
      e.preventDefault(); cell.classList.remove('dragover');
      let data; try{ data=JSON.parse(e.dataTransfer.getData('text/plain')); }catch{ return; }
      await moveEventToDate(data, dateStr);
      closePopover();
    });
    gridEl.appendChild(cell);
  }
  renderLegend();
}

async function moveEventToDate(data, dateStr){
  try{
    if(data.kind==='job'){
      const job=jobs.find(x=>x.id===data.id); if(!job) return;
      const prev=job.deadline; job.deadline=dateStr; renderCalendar();
      try{ await api('updateJobDeadline',{pageId:data.id,deadline:dateStr}); }catch(err){ job.deadline=prev; renderCalendar(); alert('저장 실패: '+err.message); }
    } else if(data.kind==='skill'){
      const s=skills.find(x=>x.id===data.id); if(!s) return;
      const prev=s.targetDate; s.targetDate=dateStr; renderCalendar();
      try{ await api('updateSkillTargetDate',{pageId:data.id,targetDate:dateStr}); }catch(err){ s.targetDate=prev; renderCalendar(); alert('저장 실패: '+err.message); }
    } else if(data.kind==='event'){
      const ev=events.find(x=>x.id===data.id); if(!ev) return;
      const prev=ev.date; ev.date=dateStr; renderCalendar();
      try{ await api('updateEvent',{pageId:data.id,date:dateStr}); }catch(err){ ev.date=prev; renderCalendar(); alert('저장 실패: '+err.message); }
    }
  }catch(err){ alert('이동 실패: '+err.message); }
}

function closePopover(){
  document.getElementById('overlay-bg').classList.remove('open');
  document.getElementById('day-popover').classList.remove('open');
}
document.getElementById('overlay-bg').addEventListener('click', closePopover);

function openDayPopover(dateStr, cellEl){
  const pop = document.getElementById('day-popover');
  const rect = cellEl.getBoundingClientRect();
  let left = rect.left; let top = rect.bottom + 8;
  if(left + 340 > window.innerWidth - 12) left = window.innerWidth - 352;
  if(top + 400 > window.innerHeight) top = Math.max(12, rect.top - 8 - 400);
  pop.style.left = left+'px'; pop.style.top = top+'px';

  const dayEvents = allEvents().filter(e=>e.date===dateStr);
  pop.innerHTML = `
    <div class="ph"><h3>${fmtDate(dateStr)}</h3><button id="pop-close">×</button></div>
    <div id="pop-list"></div>
  `;
  document.getElementById('pop-close').addEventListener('click', closePopover);
  const list = document.getElementById('pop-list');
  if(dayEvents.length===0){
    list.innerHTML = `<p style="color:var(--ink-soft);font-size:0.82rem;">이 날짜엔 일정이 없어요. 다른 일정을 여기로 드래그하거나, "+ 일정 추가"로 새로 만들 수 있어요.</p>`;
  }
  dayEvents.forEach(e=>{
    const row=document.createElement('div'); row.className='pev'; row.draggable = !!e.id;
    row.dataset.kind=e.kind; row.dataset.id=e.id||'';
    row.innerHTML = `
      <div class="tag"><i class="legend-dot" style="background:${CAT_COLORS[e.category]}"></i>${e.category}${e.kind!=='event'?' (자동)':''}</div>
      <div class="ptitle${e.kind==='event' && e.done ? ' done' : ''}">${e.kind==='event' ? `<input type="checkbox" class="pev-done" ${e.done?'checked':''}>` : ''}<span>${e.title}</span></div>
      <div class="pdetail">${e.detail||''}</div>
      ${e.kind==='event' ? `
        <ul class="psteps">${(e.steps||[]).map((st,i)=>`<li class="${st.done?'done':''}" data-i="${i}"><input type="checkbox" ${st.done?'checked':''}><span>${st.text}</span><button class="del-pstep">×</button></li>`).join('')}</ul>
        <div class="padd-step"><input type="text" placeholder="체크리스트 항목 추가"><button class="btn small add-pstep-btn">추가</button></div>
        <div class="prow-actions">
          <button class="btn ghost small pev-edit">수정</button>
          <button class="btn danger small pev-del">삭제</button>
        </div>
        <div class="pedit-fields">
          <div class="row"><input type="text" class="pe-title" value="${(e.title||'').replace(/"/g,'&quot;')}" placeholder="제목"></div>
          <div class="row"><input type="date" class="pe-date" value="${dateStr}">
            <select class="pe-category">${CATEGORIES.map(c=>`<option value="${c}" ${c===e.category?'selected':''}>${c}</option>`).join('')}</select></div>
          <div class="row"><input type="text" class="pe-note" value="${(e.detail||'').replace(/"/g,'&quot;')}" placeholder="메모"></div>
          <div class="actions"><button class="btn small pe-save">저장</button></div>
        </div>
      ` : ''}
    `;
    if(e.id){
      row.addEventListener('dragstart', ev=>{ ev.dataTransfer.setData('text/plain', JSON.stringify({kind:e.kind, id:e.id})); });
    }
    if(e.kind==='event'){
      const evObj = events.find(x=>x.id===e.id);
      async function pushChecklist(){
        try{ await api('updateEventChecklist', {pageId:evObj.id, done:evObj.done, steps:evObj.steps}); }
        catch(err){ alert('저장 실패: '+err.message); }
      }
      row.querySelector('.pev-done').addEventListener('change', async ev=>{
        evObj.done = ev.target.checked;
        row.querySelector('.ptitle').classList.toggle('done', evObj.done);
        await pushChecklist();
        renderCalendar();
      });
      row.querySelectorAll('.psteps li').forEach(li=>{
        const i = parseInt(li.dataset.i);
        li.querySelector('input').addEventListener('change', async ev=>{
          evObj.steps[i].done = ev.target.checked;
          li.classList.toggle('done', ev.target.checked);
          await pushChecklist();
        });
        li.querySelector('.del-pstep').addEventListener('click', async ()=>{
          evObj.steps.splice(i,1);
          await pushChecklist();
          openDayPopover(dateStr, cellEl);
        });
      });
      row.querySelector('.add-pstep-btn').addEventListener('click', async ()=>{
        const inp = row.querySelector('.padd-step input');
        if(!inp.value.trim()) return;
        evObj.steps.push({text:inp.value.trim(), done:false});
        await pushChecklist();
        openDayPopover(dateStr, cellEl);
      });
      row.querySelector('.pev-edit').addEventListener('click', ()=>row.querySelector('.pedit-fields').classList.toggle('open'));
      row.querySelector('.pev-del').addEventListener('click', async ()=>{
        if(!confirm('이 일정을 삭제할까요?')) return;
        try{ await api('deleteEvent',{pageId:evObj.id}); events=events.filter(x=>x.id!==evObj.id); renderCalendar(); openDayPopover(dateStr, cellEl); }
        catch(err){ alert('삭제 실패: '+err.message); }
      });
      row.querySelector('.pe-save').addEventListener('click', async ()=>{
        const payload = {
          pageId: evObj.id,
          title: row.querySelector('.pe-title').value.trim(),
          date: row.querySelector('.pe-date').value,
          category: row.querySelector('.pe-category').value,
          note: row.querySelector('.pe-note').value.trim(),
        };
        try{
          await api('updateEvent', payload);
          Object.assign(evObj, {title:payload.title, date:payload.date, category:payload.category, note:payload.note});
          renderCalendar();
          if(payload.date===dateStr) openDayPopover(dateStr, cellEl); else closePopover();
        }catch(err){ alert('저장 실패: '+err.message); }
      });
    }
    list.appendChild(row);
  });

  document.getElementById('overlay-bg').classList.add('open');
  pop.classList.add('open');
}

document.getElementById('cal-prev').addEventListener('click', ()=>{ calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderCalendar(); });
document.getElementById('cal-next').addEventListener('click', ()=>{ calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderCalendar(); });
document.getElementById('cal-today').addEventListener('click', ()=>{ calYear=TODAY.getFullYear(); calMonth=TODAY.getMonth(); renderCalendar(); });

document.getElementById('btn-new-event').addEventListener('click', ()=>document.getElementById('new-event-form').classList.add('open'));
document.getElementById('ne-cancel').addEventListener('click', ()=>document.getElementById('new-event-form').classList.remove('open'));
document.getElementById('ne-save').addEventListener('click', async ()=>{
  const title=document.getElementById('ne-title').value.trim();
  const date=document.getElementById('ne-date').value;
  const category=document.getElementById('ne-category').value;
  const note=document.getElementById('ne-note').value.trim();
  if(!title||!date){ alert('제목과 날짜를 입력해주세요.'); return; }
  try{
    const result = await api('createEvent', {title,date,note,category,steps:[]});
    events.push({id:result.id, title, date, note, category, steps:[], done:false});
    renderCalendar();
    ['ne-title','ne-date','ne-note'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('new-event-form').classList.remove('open');
  }catch(err){ alert('추가 실패: '+err.message); }
});

(async function init(){
  await loadData();
  renderStrip();
  renderKanban();
  renderSkills();
  renderCalendar();
})();
</script>
